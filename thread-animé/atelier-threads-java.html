<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier des threads Java</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout : index des scénarios à gauche, établi (scène animée + chronologie des états) au centre, code Java et journal à droite */
  --bg:#edf0f4; --surface:#ffffff; --surface-2:#f4f6f9; --ink:#14202e; --muted:#5b6979; --line:#d5dce4;
  --accent:#1e4fd0; --accent-soft:#e3eafc; --accent-ink:#ffffff;
  --run:#1e9a52; --blk:#d0393a; --wait:#d39200; --tw:#7a58d4; --end:#a2acb7;
  --ok:#1e9a52; --warn:#c07c00; --err:#cc3333;
  --code-bg:#101824; --code-ink:#d7e0ea;
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e131a; --surface:#151c25; --surface-2:#1b2430; --ink:#e4ebf2; --muted:#93a2b2; --line:#2a3542;
    --accent:#7ea4ff; --accent-soft:#1d2a46; --accent-ink:#0b1220;
    --run:#3cc477; --blk:#f06464; --wait:#f0b429; --tw:#a58bf0; --end:#5d6874;
    --ok:#3cc477; --warn:#f0b429; --err:#f06464; --code-bg:#0a0f16; --code-ink:#d7e0ea;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#151c25; --surface-2:#1b2430; --ink:#e4ebf2; --muted:#93a2b2; --line:#2a3542;
  --accent:#7ea4ff; --accent-soft:#1d2a46; --accent-ink:#0b1220;
  --run:#3cc477; --blk:#f06464; --wait:#f0b429; --tw:#a58bf0; --end:#5d6874;
  --ok:#3cc477; --warn:#f0b429; --err:#f06464; --code-bg:#0a0f16; --code-ink:#d7e0ea;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100%;transition:grid-template-columns .22s ease}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px 14px;border-bottom:1px solid var(--line)}
.mark{width:32px;height:32px;flex:none;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);padding:6px}
.brand-txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.brand h1{font:800 16px/1.15 var(--font-display);letter-spacing:-.01em;margin:0;white-space:nowrap}
.brand-txt span{font:11px var(--font-mono);color:var(--muted);white-space:nowrap}
.icon-btn{flex:none;width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px;cursor:pointer}
.icon-btn:hover{color:var(--ink);background:var(--surface-2)}
.icon-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .22s}
.navgroups{display:flex;flex-direction:column;gap:14px}
.group{display:flex;flex-direction:column;gap:2px}
.group h2{display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 10.5px var(--font-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 4px;padding:0 10px}
.group h2 i{font-style:normal;font-size:10px;letter-spacing:0;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;line-height:16px}
.nav a{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:7px 10px 7px 8px;border-radius:8px}
.nav a .num{width:28px;height:26px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--surface);font:600 11px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums;transition:background .15s,color .15s,border-color .15s}
.nav a .lbl{min-width:0;display:flex;flex-direction:column;gap:1px}
.nav a .t{font-size:14px;font-weight:500;line-height:1.25;text-wrap:balance}
.nav a small{font:11px/1.3 var(--font-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav a:hover{background:var(--surface-2)}
.nav a:hover .num{border-color:var(--muted);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft)}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav a[aria-current="page"] .num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nav a[aria-current="page"] .t{color:var(--accent);font-weight:600}
.nav .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.45}
.keys{display:flex;flex-direction:column;gap:5px}
.keys span{display:flex;align-items:center;gap:8px}
kbd{font:600 10.5px var(--font-mono);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;min-width:52px;text-align:center}
.foot p{margin:0}
/* menu replié : rail de numéros */
body.nav-collapsed .app{grid-template-columns:68px minmax(0,1fr)}
body.nav-collapsed .brand{flex-direction:column;padding:2px 0 12px}
body.nav-collapsed .brand-txt,body.nav-collapsed .lbl,body.nav-collapsed .group h2 span,body.nav-collapsed .group h2 i,body.nav-collapsed .foot{display:none}
body.nav-collapsed .icon-btn svg{transform:rotate(180deg)}
body.nav-collapsed .group h2{height:1px;background:var(--line);margin:0 8px 6px;padding:0}
body.nav-collapsed .nav a{grid-template-columns:1fr;justify-items:center;padding:6px 0}
body.nav-collapsed .navgroups{gap:10px}

main{padding:22px 26px 34px;display:flex;flex-direction:column;gap:16px;min-width:0}
.head{display:flex;flex-direction:column;gap:6px;max-width:80ch}
.eyebrow{font:600 11px var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.head h2{font:800 30px/1.1 var(--font-display);letter-spacing:-.015em;margin:0;text-wrap:balance}
.head p{margin:0;color:var(--muted);max-width:72ch}

.controls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.btns{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-width:104px}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.sep{width:1px;align-self:stretch;background:var(--line)}
.param{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:132px}
.param label{display:flex;justify-content:space-between;gap:8px}
.param output{font:600 12px var(--font-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.param input[type=range]{accent-color:var(--accent);width:100%}
.param select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 6px;font-size:13px}

.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:6px;padding:6px 12px 7px;display:flex;flex-direction:column;min-width:110px}
.stat span{font-size:11.5px;color:var(--muted)}
.stat b{font:700 19px/1.2 var(--font-display);font-variant-numeric:tabular-nums}
.stat.ok{border-left-color:var(--ok)} .stat.warn{border-left-color:var(--warn)} .stat.err{border-left-color:var(--err)}
.stat.err b{color:var(--err)}

.bench{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.panel > header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font:600 11px var(--font-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.panel > header em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400}
.canvas-wrap{position:relative}
canvas{display:block;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend code{font:11.5px var(--font-mono);color:var(--ink)}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.watch{margin:0;padding:10px 14px 12px 30px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.watch li::marker{color:var(--accent)}
pre.code{margin:0;background:var(--code-bg);color:var(--code-ink);font:12px/1.6 var(--font-mono);padding:12px 14px;overflow:auto;max-height:430px;tab-size:2}
.tk-k{color:#82b1ff}.tk-t{color:#7fdcc0}.tk-s{color:#f3c27b}.tk-c{color:#7d8b9b;font-style:italic}.tk-n{color:#f59ab4}
ol.log{list-style:none;margin:0;padding:6px 0;max-height:250px;overflow:auto;font:12px/1.5 var(--font-mono)}
ol.log li{padding:2px 12px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:6px}
ol.log li time{color:var(--muted);font-variant-numeric:tabular-nums}
ol.log li.warn{color:var(--warn)} ol.log li.err{color:var(--err);font-weight:600} ol.log li.ok{color:var(--ok)}
ol.log b{font-weight:600}

.left{display:flex;flex-direction:column;gap:16px;min-width:0}
.hr{display:flex;align-items:center;gap:10px}
.max{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:5px;padding:3px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font:600 11px var(--font-mono);text-transform:none;letter-spacing:0;line-height:1.3}
.max:hover{color:var(--ink);background:var(--surface-2)}
.max svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.only-max{display:none}
.panel.is-max .only-max{display:inline-flex;color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.backdrop{position:fixed;inset:0;background:rgba(8,13,20,.5);z-index:39;display:none}
body.has-max{overflow:hidden}
body.has-max .backdrop{display:block}
.panel.is-max{position:fixed;inset:14px;z-index:40;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.3)}
.panel.is-max > header{font-size:12px;padding:10px 14px}
.panel.is-max .canvas-wrap,.panel.is-max .tl-wrap{flex:1;min-height:0;position:relative}
.panel.is-max .canvas-wrap canvas,.panel.is-max .tl-wrap canvas{position:absolute;inset:0;height:100%}
.panel.is-max pre.code{max-height:none;flex:1;min-height:0;font-size:15px;padding:18px 22px}
.panel.is-max ol.log{max-height:none;flex:1;min-height:0;font-size:14px}
.panel.is-max ol.log li{grid-template-columns:70px minmax(0,1fr);padding:3px 18px}
.panel.is-max .watch{font-size:18px;line-height:1.55;gap:14px;padding:26px 30px 26px 52px;max-width:78ch;overflow:auto}
@media (max-width:820px){ .panel.is-max{inset:0;border-radius:0} }
@media (max-width:1240px){ .bench{grid-template-columns:minmax(0,1fr)} }
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  body.nav-collapsed .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px;gap:10px}
  .brand,body.nav-collapsed .brand{flex-direction:row;padding:0 2px 10px}
  body.nav-collapsed .brand-txt{display:flex}
  .icon-btn{display:none}
  .navgroups,body.nav-collapsed .navgroups{flex-direction:row;gap:6px;overflow-x:auto;padding-bottom:4px}
  .group{flex-direction:row;gap:6px}
  .group h2,body.nav-collapsed .group h2{display:none}
  .nav a,body.nav-collapsed .nav a{display:flex;align-items:center;gap:8px;white-space:nowrap;border:1px solid var(--line);padding:5px 10px 5px 5px}
  .nav a[aria-current="page"]::before{display:none}
  .nav a .num{width:24px;height:22px}
  body.nav-collapsed .lbl{display:flex}
  .nav a small{display:none}
  .nav a .t{white-space:nowrap;font-size:13px}
  .nav .foot{display:none}
  main{padding:16px}
  .head h2{font-size:24px}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto} }
</style>
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="Scénarios">
    <div class="brand">
      <svg class="mark" viewBox="0 0 20 20" aria-hidden="true">
        <rect x="0" y="2" width="9" height="3.4" rx="1.2" fill="var(--run)"/><rect x="10" y="2" width="4" height="3.4" rx="1.2" fill="var(--wait)"/><rect x="15" y="2" width="5" height="3.4" rx="1.2" fill="var(--run)"/>
        <rect x="0" y="8.3" width="4" height="3.4" rx="1.2" fill="var(--tw)"/><rect x="5" y="8.3" width="3" height="3.4" rx="1.2" fill="var(--blk)"/><rect x="9" y="8.3" width="11" height="3.4" rx="1.2" fill="var(--run)"/>
        <rect x="0" y="14.6" width="12" height="3.4" rx="1.2" fill="var(--run)"/><rect x="13" y="14.6" width="7" height="3.4" rx="1.2" fill="var(--wait)"/>
      </svg>
      <div class="brand-txt"><h1>Atelier des threads</h1><span>java.util.concurrent</span></div>
      <button class="icon-btn" id="collapse" type="button" aria-label="Replier le menu" title="Replier le menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    </div>
    <div class="navgroups" id="navgroups"></div>
    <div class="foot">
      <div class="keys"><span><kbd>Espace</kbd>pause / reprise</span><span><kbd>Échap</kbd>réduire un bloc agrandi</span></div>
      <p>Threads simulés sur une horloge virtuelle (ms simulées).</p>
    </div>
  </nav>
  <main>
    <div class="head">
      <div class="eyebrow" id="eyebrow"></div>
      <h2 id="title"></h2>
      <p id="blurb"></p>
    </div>
    <div class="controls" id="controls">
      <div class="btns">
        <button class="btn primary" id="play" type="button">Pause</button>
        <button class="btn" id="step" type="button" title="Avance de 100 ms simulées">Pas +100 ms</button>
        <button class="btn" id="reset" type="button">Rejouer</button>
      </div>
      <div class="param"><label for="speed">Vitesse <output id="speedOut">1×</output></label><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"></div>
      <div class="sep" aria-hidden="true"></div>
      <div id="params" style="display:contents"></div>
    </div>
    <div class="stats" id="stats" aria-live="polite"></div>
    <div class="bench">
      <div class="left">
        <section class="panel" id="pScene">
          <header><span>Scène</span><span class="hr"><em id="clock">t = 0,00 s</em><button class="max only-max" id="play2" type="button">Pause</button><button class="max" type="button" data-name="Scène"></button></span></header>
          <div class="canvas-wrap"><canvas id="scene" height="420"></canvas></div>
          <div class="legend" id="legend"></div>
        </section>
        <section class="panel" id="pTimeline">
          <header><span>Chronologie des états</span><span class="hr"><em>10 dernières secondes</em><button class="max" type="button" data-name="Chronologie des états"></button></span></header>
          <div class="tl-wrap"><canvas id="timeline" height="120"></canvas></div>
        </section>
      </div>
      <div class="side">
        <section class="panel"><header><span>À observer</span><span class="hr"><button class="max" type="button" data-name="À observer"></button></span></header><ul class="watch" id="watch"></ul></section>
        <section class="panel"><header><span>Code Java</span><span class="hr"><button class="max" type="button" data-name="Code Java"></button></span></header><pre class="code" id="code"></pre></section>
        <section class="panel"><header><span>Journal</span><span class="hr"><em>le plus récent en haut</em><button class="max" type="button" data-name="Journal"></button></span></header><ol class="log" id="log"></ol></section>
      </div>
      <div class="backdrop" id="backdrop"></div>
    </div>
  </main>
</div>

<script>
/* ======================================================================
   Moteur de simulation : chaque thread est un générateur qui "yield"
   des opérations (travail, lock, await, acquire…). Le moteur gère les
   états Java (RUNNABLE, BLOCKED, WAITING, TIMED_WAITING, TERMINATED).
   ====================================================================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const jit = (ms, f = 0.35) => Math.max(30, ms * rnd(1 - f, 1 + f));
const spread = (i, n, a, b) => n <= 1 ? (a + b) / 2 : a + i * (b - a) / (n - 1);
const ST = { RUN: 'RUNNABLE', BLK: 'BLOCKED', WAIT: 'WAITING', TW: 'TIMED_WAITING', END: 'TERMINATED' };
const ID_COLORS = ['#2f6db5', '#c25a28', '#23866c', '#8a4bb8', '#b23a63', '#5f7d1f', '#1d8098', '#9a6b12', '#4a5bc4', '#a8432f'];
const POISON = { poison: true };

const op = {
  work: (ms, label) => ({ t: 'work', ms, label }),
  sleep: (ms, label) => ({ t: 'sleep', ms, label }),
  lock: (m, label) => ({ t: 'lock', m, label }),
  unlock: (m) => ({ t: 'unlock', m }),
  tryLock: (m, ms, label) => ({ t: 'tryLock', m, ms, label }),
  await: (c, label) => ({ t: 'await', c, label }),
  signal: (c) => ({ t: 'signal', c, all: false }),
  signalAll: (c) => ({ t: 'signal', c, all: true }),
  acquire: (s, label) => ({ t: 'acquire', s, label }),
  release: (s) => ({ t: 'release', s }),
  countDown: (l) => ({ t: 'countDown', l }),
  awaitLatch: (l, label) => ({ t: 'awaitLatch', l, label }),
  barrier: (b, label) => ({ t: 'barrier', b, label }),
  exchange: (x, v, label) => ({ t: 'exchange', x, v, label }),
  take: (q, label) => ({ t: 'take', q, label }),
  get: (f, label) => ({ t: 'get', f, label }),
  readLock: (rw, label) => ({ t: 'readLock', rw, label }),
  readUnlock: (rw) => ({ t: 'readUnlock', rw }),
  writeLock: (rw, label) => ({ t: 'writeLock', rw, label }),
  writeUnlock: (rw) => ({ t: 'writeUnlock', rw }),
};

class Sim {
  constructor() { this.t = 0; this.threads = []; this.logs = []; this.S = {}; }
  log(msg, th, kind) {
    this.logs.push({ t: this.t, msg, th: th ? th.name : null, color: th ? th.color : null, kind: kind || '' });
    if (this.logs.length > 400) this.logs.splice(0, this.logs.length - 400);
  }
  spawn(name, fn, opts = {}) {
    const th = { id: this.threads.length + 1, name, color: opts.color || ID_COLORS[this.threads.length % ID_COLORS.length],
      state: ST.RUN, hist: [{ t: this.t, s: ST.RUN }], busyUntil: 0, deadline: null, onTimeout: null, resume: undefined,
      label: 'démarre', blockedOn: null, ready: true, data: {}, x: null, y: null, workStart: 0, workEnd: 0 };
    th.gen = fn(th);
    this.threads.push(th);
    return th;
  }
  // primitives
  lock(name) { return { kind: 'lock', name, owner: null, count: 0, queue: [] }; }
  cond(lock, name) { return { kind: 'cond', name, lock, waiters: [] }; }
  sem(name, n) { return { kind: 'sem', name, permits: n, total: n, queue: [] }; }
  latch(name, n) { return { kind: 'latch', name, count: n, initial: n, waiters: [], openedAt: null }; }
  barrierObj(name, n, onTrip) { return { kind: 'barrier', name, parties: n, arrived: [], generation: 0, trippedAt: -1e9, onTrip }; }
  exchanger(name) { return { kind: 'exchanger', name, slot: null, last: null, count: 0 }; }
  queue(name) { return { kind: 'queue', name, items: [], waiters: [] }; }
  future(name) { return { kind: 'future', name, done: false, value: undefined, waiters: [], doneAt: null }; }
  rwlock(name, mode) { return { kind: 'rw', name, mode, readers: new Set(), writer: null, queue: [] }; }

  check() {
    for (const th of this.threads) {
      if (th.state !== ST.BLK) continue;
      const seen = [th]; let cur = th;
      for (let k = 0; k < 20; k++) {
        const m = cur.blockedOn;
        if (!m || m.kind !== 'lock' || !m.owner) break;
        const nxt = m.owner;
        if (nxt === th) return { type: 'cycle', cycle: seen };
        if (seen.includes(nxt) || nxt.state !== ST.BLK) break;
        seen.push(nxt); cur = nxt;
      }
    }
    const active = this.threads.filter(t => t.state !== ST.END);
    if (!active.length) return { type: 'done' };
    if (active.every(t => (t.state === ST.WAIT || t.state === ST.BLK) && t.deadline == null)) return { type: 'stall' };
    return null;
  }
}

  code: () => `class BoundedBuffer<T> {
  private final Deque<T> items = new ArrayDeque<>();
  private final int capacity;
  private final ReentrantLock lock = new ReentrantLock();
  private final Condition notFull  = lock.newCondition();
  private final Condition notEmpty = lock.newCondition();

  BoundedBuffer(int capacity) { this.capacity = capacity; }

  void put(T item) throws InterruptedException {
    lock.lock();
    try {
      while (items.size() == capacity)
        notFull.await();          // libère le verrou et attend
      items.addLast(item);
      notEmpty.signal();          // réveille un consommateur
    } finally {
      lock.unlock();
    }
  }

  T take() throws InterruptedException {
    lock.lock();
    try {
      while (items.isEmpty())
        notEmpty.await();
      T item = items.removeFirst();
      notFull.signal();           // réveille un producteur
      return item;
    } finally {
      lock.unlock();
    }
  }

class SharedDoc {
  private final Semaphore mutex = new Semaphore(1);
  private final Semaphore wrt   = new Semaphore(1);
  private int readCount = 0;

  String read() throws InterruptedException {
    mutex.acquire();
    if (++readCount == 1) wrt.acquire(); // 1er lecteur bloque les écrivains
    mutex.release();

    String s = lire();                    // plusieurs lecteurs en parallèle

    mutex.acquire();
    if (--readCount == 0) wrt.release();  // dernier lecteur libère
    mutex.release();
    return s;
  }

  void write(String text) throws InterruptedException {
    wrt.acquire();                        // attend qu'aucun lecteur ne lise
    try { ecrire(text); } finally { wrt.release(); }
  }

        // second verrou indisponible : on sort, finally libère « from »
      } finally { from.lock.unlock(); }
    }
    Thread.sleep(ThreadLocalRandom.current().nextInt(50, 400)); // recul
  }
}
// T1 : transfer(A, B, …)    T2 : transfer(B, A, …)` : `void transfer(Account from, Account to, int amount) {
  from.lock.lock();
  try {
    to.lock.lock();               // attend sans limite
    try {
      from.debit(amount);
      to.credit(amount);
    } finally { to.lock.unlock(); }
  } finally { from.lock.unlock(); }
}
// T1 : transfer(A, B, …) tient A, attend B
// T2 : transfer(B, A, …) tient B, attend A   → interblocage`,
  setup(sim, p, S) {
    S.A = { name: 'A', bal: 1000, lock: sim.lock('A.lock') }; S.B = { name: 'B', bal: 1000, lock: sim.lock('B.lock') };
    S.ok = 0; S.fails = 0; S.T = [];
    for (let i = 0; i < p.n; i++) {
      const [first, second] = i % 2 === 0 ? [S.A, S.B] : [S.B, S.A];
      S.T.push(sim.spawn('T' + (i + 1), function* (th) {
        th.data.dir = `${first.name}→${second.name}`;
        yield op.sleep(rnd(0, 150), 'démarre');
        while (true) {
          if (p.mode === 'lock') {
            yield op.lock(first.lock, `${first.name}.lock()`);
            yield op.work(jit(p.hold, 0.2), `tient ${first.name}`);
            yield op.lock(second.lock, `${second.name}.lock()`);
          } else {
            const ok1 = yield op.tryLock(first.lock, p.to, `${first.name}.tryLock(${p.to})`);
            if (!ok1) { S.fails++; sim.log(`${first.name} indisponible → recule`, th, 'warn'); yield op.sleep(rnd(50, 400), 'recul aléatoire'); continue; }
            yield op.work(jit(p.hold, 0.2), `tient ${first.name}`);
            const ok2 = yield op.tryLock(second.lock, p.to, `${second.name}.tryLock(${p.to})`);
            if (!ok2) { S.fails++; sim.log(`délai écoulé sur ${second.name} → libère ${first.name}`, th, 'warn'); yield op.unlock(first.lock); yield op.sleep(rnd(50, 400), 'recul aléatoire'); continue; }
          }
          yield op.work(250, 'virement');
          const amt = Math.min(first.bal, rint(1, 20) * 10); first.bal -= amt; second.bal += amt; S.ok++;

  params: [

  ],
  code: () => `AtomicInteger count = new AtomicInteger(0);

// Chaque thread :
for (int k = 0; k < K; k++)
  count.incrementAndGet();

// incrementAndGet() fonctionne comme cette boucle CAS :
int incrementAndGet() {
  int prev, next;
  do {
    prev = get();                    // 1. lire
    next = prev + 1;                 // 2. calculer
  } while (!compareAndSet(prev, next)); // 3. écrire SI inchangé
  return next;
}
// compareAndSet est une seule instruction matérielle (CAS) :
// pas de verrou, pas d'état BLOCKED, et aucun incrément perdu.`,
  setup(sim, p, S) {
    S.value = 0; S.ok = 0; S.fail = 0; S.flashes = []; S.T = [];
    for (let i = 0; i < p.n; i++) S.T.push(sim.spawn('T' + (i + 1), function* (th) {
      for (let k = 0; k < p.k; k++) {
        yield op.work(rnd(60, 280), 'autre travail');
        while (true) {
          const prev = S.value; th.data.reg = prev;
          yield op.work(p.gap * rnd(0.6, 1.4), `compareAndSet(${prev}, ${prev + 1})`);
          if (S.value === prev) { S.value = prev + 1; S.ok++; th.data.last = { ok: true, t: sim.t }; break; }
          S.fail++; th.data.last = { ok: false, t: sim.t };

  params: [

    { id: 'use', label: 'Durée d’utilisation', min: 200, max: 2500, step: 50, value: 1300, unit: 'ms' },
  ],
  code: (p) => `class ConnectionPool {
  private final Semaphore permits = new Semaphore(${p.permits});

  void query(String sql) throws InterruptedException {
    permits.acquire();            // prend un permis (ou attend)
    try {
      Connection c = borrow();
      c.execute(sql);             // au plus ${p.permits} threads ici
      giveBack(c);
    } finally {
      permits.release();          // rend le permis, réveille un thread
    }
  }
}`,
  setup(sim, p, S) {
    S.s = sim.sem('permits', p.permits); S.slots = Array(p.permits).fill(null); S.uses = 0; S.T = [];
    for (let i = 0; i < p.n; i++) S.T.push(sim.spawn('T' + (i + 1), function* (th) {
      yield op.sleep(rnd(0, 600), 'prépare une requête');
      while (true) {
        yield op.acquire(S.s, 'acquire()');
        const k = S.slots.indexOf(null); S.slots[k] = th; th.data.slot = k;
        yield op.work(jit(p.use), `requête sur connexion ${k + 1}`); S.uses++;
        S.slots[k] = null; th.data.slot = null;
        yield op.release(S.s);
        yield op.sleep(jit(800, 0.6), 'prépare une requête');
      }
    }));
  },
  stats(sim, p, S) {
    return [
      { label: 'Permis disponibles', value: `${S.s.permits} / ${p.permits}`, tone: S.s.permits ? 'ok' : 'warn' },
      { label: 'Threads en attente', value: S.s.queue.length, tone: S.s.queue.length ? 'warn' : '' },
      { label: 'Requêtes terminées', value: S.uses },

  draw(ctx, W, H, sim, p, S) {
    const n = p.permits, sw = Math.min(96, W * 0.5 / n), x0 = W * 0.58 - (sw * n) / 2, y = H * 0.5;
    zl(ctx, `Semaphore(${n}) · pool de connexions`, x0 + sw * n / 2, y - 58);
    for (let k = 0; k < n; k++) {
      const occ = S.slots[k];
      box(ctx, x0 + k * sw + 4, y - 40, sw - 8, 80, { fill: occ ? alpha(occ.color, 0.12) : C.surface2, stroke: occ ? occ.color : C.line, lw: 1.5, r: 8 });
      txt(ctx, `connexion ${k + 1}`, x0 + k * sw + sw / 2, y + 28, { font: 'mono', size: 10, color: C.muted, maxw: sw - 12 });
    }
    if (S.s.queue.length) zl(ctx, 'acquire() en attente', x0 - 24, y - 58, 'right');
    const top = S.T.filter(t => t.data.slot == null && !S.s.queue.includes(t));

      else { const k = top.indexOf(th); x = spread(k, top.length, W * 0.08, W * 0.92); yy = H * 0.14; }
      drawThread(ctx, th, x, yy, { label: lab, maxw: 96 });
    });
  }

  code: (p) => `Exchanger<Buffer> exchanger = new Exchanger<>();

class Filler implements Runnable {
  Buffer current = new Buffer(${p.size});        // tampon A
  public void run() {
    while (true) {
      while (!current.isFull()) current.add(read());
      current = exchanger.exchange(current);  // donne le plein, reçoit le vide
    }
  }
}

class Emptier implements Runnable {
  Buffer current = new Buffer(${p.size});        // tampon B (vide)
  public void run() {
    while (true) {

    }
  }

  setup(sim, p, S) {

{
  id: 'callable-future', group: 'Exécution asynchrone', title: 'Callable et Future', short: 'ExecutorService',
  blurb: 'main soumet des Callable à un pool de threads fixe. Chaque submit() rend tout de suite un Future ; les tâches attendent dans la file du pool. Plus tard, main appelle get() sur chaque Future et attend si le résultat n’est pas encore prêt.',
  watch: [
    'submit() ne bloque pas : main continue à travailler pendant que le pool exécute.',
    'Avec un pool de 2, seules 2 tâches tournent en même temps ; les autres attendent dans la file.',
    'get() sur un Future pas encore terminé met main en WAITING (flèche vers le Future concerné).'
  ],
  params: [
    { id: 'pool', label: 'Taille du pool', min: 1, max: 4, step: 1, value: 2 },
    { id: 'n', label: 'Tâches', min: 2, max: 8, step: 1, value: 5 },
    { id: 'tm', label: 'Durée d’une tâche', min: 300, max: 2500, step: 100, value: 1300, unit: 'ms' },
  ],
  code: (p) => `ExecutorService pool = Executors.newFixedThreadPool(${p.pool});
List<Future<Integer>> futures = new ArrayList<>();

for (int i = 1; i <= ${p.n}; i++) {
  int id = i;
  Callable<Integer> task = () -> {   // renvoie une valeur,
    Thread.sleep(work(id));           // peut lever une exception
    return compute(id);
  };
  futures.add(pool.submit(task));    // rend la main tout de suite
}

doSomethingElse();

int sum = 0;
for (Future<Integer> f : futures)
  sum += f.get();                    // bloque si pas encore prêt

pool.shutdown();`,
  setup(sim, p, S) {
    S.q = sim.queue('file'); S.tasks = []; S.sum = 0; S.W = [];
    for (let i = 1; i <= p.n; i++) S.tasks.push({ id: i, ms: jit(p.tm, 0.5), result: rint(10, 99), future: sim.future('f' + i), state: 'new' });
    S.main = sim.spawn('main', function* (th) {
      for (const tk of S.tasks) { yield op.work(140, `submit(tâche ${tk.id})`); tk.state = 'queued'; sim.put(S.q, tk); sim.log(`submit(tâche ${tk.id}) → Future f${tk.id}`, th); }
      yield op.work(600, 'doSomethingElse()');
      for (const tk of S.tasks) {
        if (!tk.future.done) sim.log(`f${tk.id}.get() : pas prêt, attend`, th, 'warn');
        const v = yield op.get(tk.future, `f${tk.id}.get()`); S.sum += v;
        sim.log(`f${tk.id}.get() → ${v}`, th);
      }
      sim.log(`somme = ${S.sum} · pool.shutdown()`, th, 'ok');
      for (let k = 0; k < p.pool; k++) sim.put(S.q, POISON);
    });
    for (let k = 0; k < p.pool; k++) S.W.push(sim.spawn('W' + (k + 1), function* (th) {
      while (true) {
        const tk = yield op.take(S.q, 'attend une tâche');
        if (tk === POISON) break;
        tk.state = 'running'; tk.worker = th; th.data.task = tk;
        yield op.work(tk.ms, `call() tâche ${tk.id}`);
        tk.state = 'done'; th.data.task = null; sim.complete(tk.future, tk.result);
        sim.log(`tâche ${tk.id} terminée → ${tk.result}`, th, 'ok');
      }
    }));
  },
  stats(sim, p, S) {
    const done = S.tasks.filter(t => t.state === 'done').length;
    return [
      { label: 'Tâches terminées', value: `${done} / ${p.n}`, tone: done === p.n ? 'ok' : '' },
      { label: 'Dans la file du pool', value: S.q.items.filter(x => x !== POISON).length },
      { label: 'Somme des get()', value: S.sum },
    ];
  },
  draw(ctx, W, H, sim, p, S) {
    const qx = W * 0.32, wx = W * 0.6;
    zl(ctx, 'file du pool', qx, H * 0.07); zl(ctx, `pool (${p.pool} threads)`, wx, H * 0.07);
    // futures
    const fy = H * 0.86, fw = Math.min(84, (W * 0.74) / p.n - 8);
    S.tasks.forEach((tk, i) => {
      const x = spread(i, p.n, W * 0.24, W * 0.94), f = tk.future;

      box(ctx, x - fw / 2, fy - 20, fw, 40, { fill: f.done ? alpha(C.ok, 0.14) : C.surface2, stroke: f.done ? C.ok : C.line, lw: 1.5 });
      txt(ctx, `f${tk.id}`, x, fy - 7, { font: 'mono', size: 11, weight: 600 });
      txt(ctx, f.done ? `= ${f.value}` : tk.state === 'running' ? 'en cours' : tk.state === 'queued' ? 'en file' : '—', x, fy + 9, { font: 'mono', size: 10, color: f.done ? C.ok : C.muted });
    });
    // tâches
    const queued = S.q.items.filter(x => x !== POISON);
    S.tasks.forEach(tk => {
      let tx, ty;
      if (tk.state === 'queued') { const k = queued.indexOf(tk); tx = qx; ty = H * 0.15 + k * 32; }

      tk.p = tk.p || { x: S.main.x ?? tx, y: S.main.y ?? ty }; lerpObj(tk.p, tx, ty);
      box(ctx, tk.p.x - 40, tk.p.y - 13, 80, 26, { fill: C.surface, stroke: tk.state === 'running' ? C.accent : C.line, lw: 1.5, r: 5 });
      txt(ctx, `tâche ${tk.id}`, tk.p.x, tk.p.y + 0.5, { font: 'mono', size: 11 });

    S.W.forEach((th, i) => drawThread(ctx, th, wx, spread(i, S.W.length, H * 0.18, H * 0.62), { maxw: 130 }));
    drawThread(ctx, S.main, W * 0.09, H * 0.42, { maxw: 120 });
    const f = S.main.blockedOn;
    if (f && f.kind === 'future') { const tk = S.tasks.find(t => t.future === f); arrow(ctx, S.main.x, S.main.y, tk.fx, fy - 22, C.wait, { s1: 22, s2: 2, dash: [5, 4], w: 2 }); }

{
  id: 'completable-future', group: 'Exécution asynchrone', title: 'CompletableFuture', short: 'pipeline',
  blurb: 'Un pipeline asynchrone : trois supplyAsync partent en parallèle sur le ForkJoinPool commun, thenCombine attend le prix et le taux, thenApply formate le résultat, et main ne bloque qu’à la fin sur allOf(…).join().',
  watch: [
    'Les étapes suivantes se déclenchent toutes seules quand leurs dépendances sont terminées, sans thread qui attende.',
    'En mode thenApply / thenCombine, l’étape suivante tourne dans le thread qui a terminé la dernière dépendance (regardez qui l’exécute).',
    'En mode …Async, chaque étape repasse par la file du pool et peut changer de thread.'
  ],
  params: [
    { id: 'mode', label: 'Variante', type: 'select', value: 'sync', options: [['sync', 'thenCombine / thenApply'], ['async', 'thenCombineAsync / thenApplyAsync']] },

  ],
  code: (p) => { const a = p.mode === 'async' ? 'Async' : ''; return `CompletableFuture<Double> price =
    CompletableFuture.supplyAsync(() -> fetchPriceEUR());   // ~1,4 s
CompletableFuture<Double> rate =
    CompletableFuture.supplyAsync(() -> fetchRateUSD());    // ~2,0 s
CompletableFuture<Integer> stock =
    CompletableFuture.supplyAsync(() -> checkStock());      // ~1,1 s

CompletableFuture<String> label = price
    .thenCombine${a}(rate, (p, r) -> p * r)               // dès que les 2 sont là
    .thenApply${a}(usd -> String.format("%.2f $", usd));

doSomethingElse();                                 // main n'attend pas

CompletableFuture.allOf(label, stock).join();      // seul point bloquant
System.out.println(label.join() + " · stock " + stock.join());`; },
  setup(sim, p, S) {
    const m = p.lat / 100;
    const mk = (id, label, deps, ms, fn) => ({ id, label, deps, ms: ms * m, fn, state: 'pending', f: sim.future(id), worker: null, value: undefined });
    const price = mk('price', 'supplyAsync(prix)', [], jit(1400, 0.25), () => 120);
    const rate = mk('rate', 'supplyAsync(taux)', [], jit(2000, 0.25), () => 1.08);
    const stock = mk('stock', 'supplyAsync(stock)', [], jit(1100, 0.25), () => 14);
    const comb = mk('comb', `thenCombine${p.mode === 'async' ? 'Async' : ''}(p × r)`, [price, rate], 500, (a, b) => +(a * b).toFixed(2));
    const fmt = mk('fmt', `thenApply${p.mode === 'async' ? 'Async' : ''}(format)`, [comb], 400, v => v.toFixed(2) + ' $');
    const all = mk('all', 'allOf(label, stock)', [fmt, stock], 0, () => 'ok');
    S.nodes = [price, rate, stock, comb, fmt, all]; S.q = sim.queue('commonPool'); S.W = []; S.result = null;
    S.nodes.forEach(n => n.dependents = S.nodes.filter(d => d.deps.includes(n)));
    function* runNode(th, node) {
      node.state = 'running'; node.worker = th; node.ranBy = th.name; th.data.node = node;
      yield op.work(node.ms, node.label);
      node.value = node.fn(...node.deps.map(d => d.value)); node.state = 'done'; th.data.node = null;
      sim.complete(node.f, node.value); sim.log(`${node.label} → ${node.value}`, th, 'ok');
      let next = null;
      for (const d of node.dependents) {
        if (d.state !== 'pending' || !d.deps.every(x => x.state === 'done')) continue;
        if (d.id === 'all') { d.state = 'done'; d.ranBy = th.name; d.value = 'ok'; sim.complete(d.f, 'ok'); sim.log('allOf terminé : main peut reprendre', th, 'ok'); continue; }
        if (p.mode === 'sync' && !next) { d.state = 'queued'; next = d; sim.log(`enchaîne ${d.label} dans le même thread`, th); }
        else { d.state = 'queued'; sim.put(S.q, d); }
      }
      return next;
    }
    for (let k = 0; k < p.pool; k++) S.W.push(sim.spawn('FJ' + (k + 1), function* (th) {
      while (true) {
        let node = yield op.take(S.q, 'attend une tâche');

      yield op.work(jit(900, 0.3), 'doSomethingElse()');
      if (!all.f.done) sim.log('allOf(…).join() : pas prêt, attend', th, 'warn');

      S.result = `${fmt.value} · stock ${stock.value}`;
      sim.log(`affiche « ${S.result} »`, th, 'ok');
      for (let k = 0; k < p.pool; k++) sim.put(S.q, POISON);
    });
  },

    // arêtes
    S.nodes.forEach(n => n.deps.forEach(d => {
      const [x1, y1] = P[d.id], [x2, y2] = P[n.id];

      txt(ctx, sub, x, y + 9, { font: 'mono', size: 10, color: n.state === 'done' ? C.ok : C.muted, maxw: bw - 10 });

let SIM = null, SCN = null, P = {}, running = true, speed = 1, lastTs = 0, END = null, W0 = 800, H0 = 420, lastUi = 0;
const paramStore = {};

if (typeof document !== 'undefined') {
  const $ = id => document.getElementById(id);
  const sceneC = $('scene'), tlC = $('timeline');

  function readTokens() {
    const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim();
    C = { surface: g('--surface'), surface2: g('--surface-2'), ink: g('--ink'), muted: g('--muted'), line: g('--line'), accent: g('--accent'),
      run: g('--run'), blk: g('--blk'), wait: g('--wait'), tw: g('--tw'), end: g('--end'), ok: g('--ok'), warn: g('--warn'), err: g('--err') };
  }
  readTokens();
  if (typeof matchMedia !== 'undefined') matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTokens);
  new MutationObserver(readTokens).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function hl(code) {
    const KW = 'abstract|boolean|break|catch|class|do|double|else|final|finally|for|if|implements|int|new|private|public|return|static|synchronized|this|throw|throws|true|false|try|void|while|var|null';
    const re = new RegExp(`(//.*$)|("(?:[^"\\\\]|\\\\.)*")|\\b(${KW})\\b|\\b([A-Z][A-Za-z0-9_]*)\\b|\\b(\\d+)\\b`, 'gm');
    return esc(code).replace(re, (m, c, s, k, t, n) => c ? `<span class="tk-c">${c}</span>` : s ? `<span class="tk-s">${s}</span>` : k ? `<span class="tk-k">${k}</span>` : t ? `<span class="tk-t">${t}</span>` : `<span class="tk-n">${n}</span>`);
  }

  // navigation
  const groups = [...new Set(SCENARIOS.map(s => s.group))];
  $('navgroups').innerHTML = groups.map(g => {
    const items = SCENARIOS.filter(s => s.group === g);
    return `<div class="group"><h2><span>${esc(g)}</span><i>${items.length}</i></h2>${items.map(s => {
      const n = String(SCENARIOS.indexOf(s) + 1).padStart(2, '0');
      return `<a href="#${s.id}" data-id="${s.id}" title="${esc(s.title)} · ${esc(s.short)}"><b class="num">${n}</b><span class="lbl"><span class="t">${esc(s.title)}</span><small>${esc(s.short)}</small></span></a>`;
    }).join('')}</div>`;
  }).join('');
  function setCollapsed(on) {
    document.body.classList.toggle('nav-collapsed', on);
    const b = $('collapse'); const l = on ? 'Déplier le menu' : 'Replier le menu'; b.setAttribute('aria-label', l); b.title = l; b.setAttribute('aria-expanded', on ? 'false' : 'true');
    try { localStorage.setItem('threads-nav-collapsed', on ? '1' : '0'); } catch (e) {}
  }
  let navPref = false; try { navPref = localStorage.getItem('threads-nav-collapsed') === '1'; } catch (e) {}
  setCollapsed(navPref);
  $('collapse').addEventListener('click', () => setCollapsed(!document.body.classList.contains('nav-collapsed')));

  $('legend').innerHTML = [['run', 'RUNNABLE', 'en cours'], ['blk', 'BLOCKED', 'attend un verrou'], ['wait', 'WAITING', 'attend un signal'], ['tw', 'TIMED_WAITING', 'attente avec délai'], ['end', 'TERMINATED', 'terminé']]
    .map(([v, n, d]) => `<span><i style="background:var(--${v})"></i><code>${n}</code> ${d}</span>`).join('') + '<span>arc noir : travail en cours · arc violet : délai restant</span>';

  function load(id) {
    SCN = SCENARIOS.find(s => s.id === id) || SCENARIOS[0];
    if (!paramStore[SCN.id]) paramStore[SCN.id] = Object.fromEntries(SCN.params.map(q => [q.id, q.value]));
    P = paramStore[SCN.id];
    document.querySelectorAll('.nav a').forEach(a => a.setAttribute('aria-current', a.dataset.id === SCN.id ? 'page' : 'false'));
    $('eyebrow').textContent = SCN.group; $('title').textContent = SCN.title; $('blurb').textContent = SCN.blurb;
    $('watch').innerHTML = SCN.watch.map(w => `<li>${esc(w)}</li>`).join('');
    $('params').innerHTML = SCN.params.map(q => {
      const pid = 'p-' + q.id;
      if (q.type === 'select') return `<div class="param"><label for="${pid}">${esc(q.label)}</label><select id="${pid}" data-k="${q.id}">${q.options.map(([v, l]) => `<option value="${v}"${P[q.id] === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
      return `<div class="param"><label for="${pid}">${esc(q.label)} <output id="${pid}-o">${P[q.id]}${q.unit ? ' ' + q.unit : ''}</output></label><input id="${pid}" type="range" data-k="${q.id}" min="${q.min}" max="${q.max}" step="${q.step || 1}" value="${P[q.id]}"></div>`;
    }).join('');
    $('params').querySelectorAll('[data-k]').forEach(el => {
      const q = SCN.params.find(x => x.id === el.dataset.k);
      el.addEventListener('input', () => {
        P[q.id] = q.type === 'select' ? el.value : +el.value;
        const o = document.getElementById(el.id + '-o'); if (o) o.textContent = P[q.id] + (q.unit ? ' ' + q.unit : '');
        if (q.type !== 'select') return; reset();
      });
      if (q.type !== 'select') el.addEventListener('change', reset);
    });
    reset();
  }
  function reset() {
    SIM = new Sim(); END = null; SCN.setup(SIM, P, SIM.S);
    $('code').innerHTML = hl(SCN.code(P));
    setRunning(true); updateUi(true);
  }
  function setRunning(v) { running = v; for (const id of ['play', 'play2']) { $(id).textContent = v ? 'Pause' : (END ? 'Terminé' : 'Reprendre'); $(id).disabled = !!END && !v; } }
  function checkEnd() {
    const r = SIM.check(); if (!r) return;
    END = r;
    if (r.type === 'cycle') SIM.log('Interblocage : ' + r.cycle.map(t => t.name).join(' → ') + ' → ' + r.cycle[0].name, null, 'err');
    else if (r.type === 'stall') SIM.log('Tous les threads attendent : plus rien ne peut avancer', null, 'err');
    else SIM.log('Tous les threads sont terminés', null, 'ok');
    setRunning(false); updateUi(true);
  }
  $('play').addEventListener('click', () => { if (END) return; setRunning(!running); });
  $('step').addEventListener('click', () => { if (END) return; setRunning(false); SIM.advance(100); checkEnd(); updateUi(true); });
  $('reset').addEventListener('click', reset);
  $('speed').addEventListener('input', e => { speed = +e.target.value; $('speedOut').textContent = String(speed).replace('.', ',') + '×'; });
  document.addEventListener('keydown', e => {
    if (e.code !== 'Space' || /INPUT|SELECT|BUTTON|TEXTAREA/.test(document.activeElement.tagName)) return;
    e.preventDefault(); if (!END) setRunning(!running);
  });
  window.addEventListener('hashchange', () => load(location.hash.slice(1)));
  // agrandir / réduire chaque bloc
  const ICON_MAX = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10V4h6M20 14v6h-6M4 4l6 6M20 20l-6-6"/></svg>';
  const ICON_MIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4v6H4M14 20v-6h6M10 10L4 4M14 14l6 6"/></svg>';
  const maxBtns = [...document.querySelectorAll('.max[data-name]')];
  function setMax(panel, on) {
    panel.classList.toggle('is-max', on);
    const b = panel.querySelector('.max[data-name]');
    b.innerHTML = (on ? ICON_MIN : ICON_MAX) + `<span>${on ? 'Réduire' : 'Agrandir'}</span>`;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.setAttribute('aria-label', `${on ? 'Réduire' : 'Agrandir'} le bloc ${b.dataset.name}`);
    b.title = on ? 'Réduire (Échap)' : 'Agrandir en plein écran';
    document.body.classList.toggle('has-max', !!document.querySelector('.panel.is-max'));
  }
  function restoreAll() { document.querySelectorAll('.panel.is-max').forEach(p => setMax(p, false)); }
  maxBtns.forEach(b => {
    const panel = b.closest('.panel'); setMax(panel, false);
    b.addEventListener('click', () => { const on = !panel.classList.contains('is-max'); restoreAll(); if (on) setMax(panel, true); b.blur(); });
  });
  $('backdrop').addEventListener('click', restoreAll);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('has-max')) restoreAll(); });
  $('play2').addEventListener('click', () => { if (END) return; setRunning(!running); $('play2').blur(); });

  function updateUi(force) {
    const now = performance.now(); if (!force && now - lastUi < 150) return; lastUi = now;
    $('clock').textContent = 't = ' + (SIM.t / 1000).toFixed(2).replace('.', ',') + ' s';
    $('stats').innerHTML = SCN.stats(SIM, P, SIM.S).map(s => `<div class="stat ${s.tone || ''}"><span>${esc(s.label)}</span><b>${esc(s.value)}</b></div>`).join('');
    const L = SIM.logs.slice(-80).reverse();
    $('log').innerHTML = L.map(l => `<li class="${l.kind}"><time>${(l.t / 1000).toFixed(2).replace('.', ',')}</time><span>${l.th ? `<b style="color:${l.color}">${esc(l.th)}</b> ` : ''}${esc(l.msg)}</span></li>`).join('');
  }

  function sizeCanvas(c, h) {
    const dpr = window.devicePixelRatio || 1, w = c.clientWidth;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); c.style.height = h + 'px'; }
    const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return [ctx, w, h];
  }
  function drawScene() {
    const H = $('pScene').classList.contains('is-max') ? Math.max(300, sceneC.parentElement.clientHeight) : (sceneC.clientWidth < 560 ? 400 : 430);
    const [ctx, W] = sizeCanvas(sceneC, H); W0 = W; H0 = H;
    ctx.fillStyle = C.surface; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = alpha(C.line, 0.7);
    for (let x = 12; x < W; x += 24) for (let y = 12; y < H; y += 24) ctx.fillRect(x, y, 1.2, 1.2);
    SCN.draw(ctx, W, H, SIM, P, SIM.S, END);
    if (END) {
      if (END.type === 'cycle') banner(ctx, W, 'Interblocage détecté : ' + END.cycle.map(t => t.name).join(' → ') + ' → ' + END.cycle[0].name, C.err);
      else if (END.type === 'stall') banner(ctx, W, 'Tous les threads attendent : plus rien ne peut avancer', C.err);
      else banner(ctx, W, 'Scénario terminé · « Rejouer » pour recommencer', C.ok);
    }
  }
  function drawTimeline() {
    const th = SIM.threads, top = 8, isMax = $('pTimeline').classList.contains('is-max');
    let lane = 20, H = top + th.length * lane + 24;
    if (isMax) { H = Math.max(160, tlC.parentElement.clientHeight); lane = clamp((H - top - 28) / Math.max(1, th.length), 20, 56); }
    const [ctx, W] = sizeCanvas(tlC, H);
    ctx.fillStyle = C.surface; ctx.fillRect(0, 0, W, H);
    const lx = 58, win = 10000, t1 = Math.max(SIM.t, win), t0 = t1 - win, sx = t => lx + (t - t0) / win * (W - lx - 12);
    for (let s = Math.ceil(t0 / 1000) * 1000; s <= t1; s += 1000) {
      const x = sx(s); ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, top - 2); ctx.lineTo(x, H - 18); ctx.stroke();
      txt(ctx, (s / 1000) + ' s', x, H - 9, { font: 'mono', size: 10, color: C.muted });
    }
    th.forEach((t, i) => {
      const y = top + i * lane;
      txt(ctx, t.name, lx - 8, y + lane / 2, { font: 'mono', size: isMax ? 13 : 11, weight: 600, align: 'right', color: t.color });
      for (let k = 0; k < t.hist.length; k++) {
        const a = t.hist[k].t, b = k + 1 < t.hist.length ? t.hist[k + 1].t : SIM.t, s = t.hist[k].s;
        if (b < t0 || s === ST.END) continue;
        const xa = sx(Math.max(a, t0)), xb = sx(b);
        ctx.fillStyle = stateColor(s); ctx.fillRect(xa, y + 3, Math.max(1, xb - xa), lane - 6);
      }
    });
  }
  function frame(ts) {
    const dt = lastTs ? Math.min(50, ts - lastTs) : 16; lastTs = ts;
    if (running && !END) { SIM.advance(dt * speed); checkEnd(); }
    try { drawScene(); drawTimeline(); } catch (e) { console.error(e); }
    updateUi(false);
    requestAnimationFrame(frame);
  }
  load(location.hash.slice(1));
  requestAnimationFrame(frame);
}
if (typeof module !== 'undefined') module.exports = { Sim, SCENARIOS, ST, setSim: s => { SIM = s; } };
</script>
